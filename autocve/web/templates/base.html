<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AutoCVE{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">AutoCVE</a>
    <nav><a href="/projects">프로젝트</a><a href="/settings/keys">API 키</a></nav>
  </header>
  <main>
    {% if notice %}
      <div class="notice notice-{{ notice[0] }}" role="status">{{ notice[1] }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
